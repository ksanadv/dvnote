# Builds and publishes a GitHub release whenever a version tag (v1.2.3) is pushed. release.ps1 makes such a tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version in Cargo.toml
        run: |
          $tag = '${{ github.ref_name }}'
          $pattern = '^version\s*=\s*"([^"]+)"'
          foreach ($f in 'Cargo.toml', 'installer/Cargo.toml') {
            $v = (Select-String -Path $f -Pattern $pattern | Select-Object -First 1).Matches.Groups[1].Value
            if ("v$v" -ne $tag) { throw "$f says $v but the tag is $tag" }
          }

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Test
        run: cargo test --release

      - name: Build the setup program
        run: ./build-installer.ps1

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $target = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).target_directory
          Copy-Item (Join-Path $target 'release\dvnote.exe') dist\dvnote.exe
          # dvnote checks the setup against this file before running it during an update
          foreach ($name in 'dvnote-Setup.exe', 'dvnote.exe') {
            $hash = (Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLower()
            [IO.File]::WriteAllText("$PWD\dist\$name.sha256", "$hash  $name`n")
          }
          gh release create $tag --verify-tag --title "dvnote $($tag.TrimStart('v'))" --generate-notes `
            dist\dvnote-Setup.exe dist\dvnote-Setup.exe.sha256 dist\dvnote.exe dist\dvnote.exe.sha256
