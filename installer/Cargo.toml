[package]
name = "dvnote-setup"
version = "0.3.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Installer for dvnote"

[workspace]

[dependencies]
rfd = "0.17.2"
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_Foundation"] }

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
